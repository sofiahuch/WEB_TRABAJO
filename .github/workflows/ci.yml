name: Comprobar Entretiempo

on:
  push:
    branches: [main, feature/entretiempo]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Construir imagen
        run: docker build -t entretiempo:test .
      - name: Arrancar y comprobar contenedor
        run: |
          docker run -d --name entretiempo -p 3000:3000 entretiempo:test
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs entretiempo
          exit 1
      - name: Detener contenedor
        if: always()
        run: docker rm -f entretiempo || true
