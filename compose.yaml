services:
  web:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: 3000
      DATABASE_PATH: /app/data/entretiempo.sqlite
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      APP_ORIGIN: ${APP_ORIGIN:-}
    volumes:
      - entretiempo-data:/app/data
    restart: unless-stopped

volumes:
  entretiempo-data:
